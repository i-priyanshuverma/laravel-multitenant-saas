apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-web
  namespace: default
  labels:
    app: saas-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: saas-web
  template:
    metadata:
      labels:
        app: saas-web
    spec:
      containers:
      - name: app
        image: ghcr.io/saas/laravel-app:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: saas-config
        - secretRef:
            name: saas-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
