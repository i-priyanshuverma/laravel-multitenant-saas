apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - "*.saas.com"
    - "saas.com"
    secretName: saas-tls-cert
  rules:
  - host: "*.saas.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-web-service
            port:
              number: 80
