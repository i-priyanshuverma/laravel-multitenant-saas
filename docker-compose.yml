version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-multitenant-app
    container_name: saas_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - saas_network

  web:
    image: nginx:alpine
    container_name: saas_web
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - saas_network

  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - saas_network

  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
